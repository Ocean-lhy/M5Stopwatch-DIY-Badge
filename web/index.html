<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#087ac1">
  <title>M5 Badge Studio</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand"><img src="/assets/m5logo.svg" alt="M5Stack"><span></span><strong>Badge Studio</strong></div>
    <div class="top-actions">
      <div class="conn" id="conn"><i></i><b id="connText">连接中</b></div>
      <div class="seg small lang" id="lang" role="radiogroup" aria-label="Language">
        <button type="button" role="radio" data-lang="zh" aria-checked="true">中文</button>
        <button type="button" role="radio" data-lang="en" aria-checked="false">EN</button>
      </div>
    </div>
  </header>

  <main>
    <div class="layout">
      <aside class="preview">
        <div class="bezel"><canvas id="preview" width="466" height="466" data-i18n-aria="previewAria" aria-label="胸牌屏幕预览"></canvas></div>
        <div class="seg" id="previewTabs" role="tablist" data-i18n-aria="tabsAria" aria-label="预览页面">
          <button role="tab" data-view="card" aria-selected="true" data-i18n="tabCard">名片</button>
          <button role="tab" data-view="scan" aria-selected="false" data-i18n="tabScan">扫码</button>
          <button role="tab" data-view="ambient" aria-selected="false" data-i18n="tabAmbient">待机</button>
        </div>
        <dl class="device">
          <div><dt data-i18n="battery">电量</dt><dd id="devBattery">--</dd></div>
          <div><dt data-i18n="hotspot">热点</dt><dd id="devSsid" class="mono">--</dd></div>
        </dl>
      </aside>

      <div class="steps">
        <section class="step">
          <header><span class="num">1</span><div><h2 data-i18n="cardInfo">名片信息</h2></div></header>
          <div class="grid">
            <label class="wide"><span data-i18n="name">姓名</span><input id="name" maxlength="24" autocomplete="name" data-i18n-placeholder="namePh" placeholder="姓名"></label>
            <label><span data-i18n="job">职位</span><input id="title" maxlength="24" data-i18n-placeholder="jobPh" placeholder="职位"></label>
            <label><span data-i18n="company">公司</span><input id="company" maxlength="24" data-i18n-placeholder="companyPh" placeholder="公司"></label>
            <label class="wide"><span data-i18n="tags">标签</span><input id="tags" maxlength="60" data-i18n-placeholder="tagsPh" placeholder="逗号分隔，最多 3 个"></label>
          </div>
        </section>

        <section class="step">
          <header><span class="num">2</span><div><h2 data-i18n="avatar">头像</h2><p data-i18n="avatarHint">拖动调整位置</p></div></header>
          <div class="avatar-row">
            <div class="cropper"><canvas id="crop" width="440" height="440" data-i18n-aria="cropAria" aria-label="头像裁剪"></canvas></div>
            <div class="avatar-tools">
              <button id="avatarPick" class="btn" type="button" data-i18n="pickPhoto">选择照片</button>
              <input id="avatarFile" class="file-input" type="file" accept="image/*">
              <label class="range"><span data-i18n="zoom">缩放</span><input id="zoom" type="range" min="1" max="3" step="0.01" value="1"></label>
            </div>
          </div>
        </section>

        <section class="step">
          <header><span class="num">3</span><div><h2 data-i18n="qr">二维码</h2><p data-i18n="qrHint">选择二维码截图自动识别，最多 3 个</p></div></header>
          <div id="slots" class="slots"></div>
          <div class="actions-row">
            <button id="addSlot" class="ghost" type="button" data-i18n="addQr">添加二维码</button>
            <button id="addVcard" class="ghost" type="button" data-i18n="addVcard">生成联系人二维码</button>
          </div>
          <div class="grid">
            <label><span data-i18n="email">邮箱</span><input id="email" maxlength="60" inputmode="email" placeholder="name@company.com"></label>
            <label><span data-i18n="phone">电话</span><input id="phone" maxlength="20" inputmode="tel" data-i18n-placeholder="phonePh" placeholder="可选"></label>
          </div>
          <p class="notice"><span data-i18n="wechatHint">微信：我 → 个人资料 → 我的二维码 → “…” → 保存图片</span></p>
        </section>

        <section class="step">
          <header><span class="num">4</span><div><h2 data-i18n="look">外观</h2></div></header>
          <div class="themes" id="themes" role="radiogroup" data-i18n-aria="themesAria" aria-label="主题"></div>
          <label class="range"><span data-i18n="brightness">名片亮度</span> <output id="brightnessOut">200</output><input id="brightness" type="range" min="60" max="255" value="200"></label>
          <div class="field">
            <label class="range"><span data-i18n="ambient">进入待机</span> <output id="ambientOut">45 秒</output><input id="ambientAfter" type="range" min="10" max="60" value="45"></label>
            <label class="switch"><input id="ambientNever" type="checkbox"><span></span><em data-i18n="never">从不</em></label>
          </div>
          <label class="range"><span data-i18n="scanBack">扫码页返回</span> <output id="scanOut">30 秒</output><input id="scanTimeout" type="range" min="10" max="30" value="30"></label>
          <div class="field"><span class="label" data-i18n="rotation">屏幕方向</span>
            <div class="seg small" id="rotation" role="radiogroup" data-i18n-aria="rotationAria" aria-label="屏幕方向">
              <button type="button" data-v="0">0°</button><button type="button" data-v="1">90°</button><button type="button" data-v="2">180°</button><button type="button" data-v="3">270°</button>
            </div>
          </div>
        </section>

        <section class="guide">
          <h2 data-i18n="keys">按键</h2>
          <dl>
            <div><dt><i class="key yellow"></i><span data-i18n="yellow">黄键</span></dt><dd data-i18n="yellowDo">扫码页 / 返回</dd></div>
            <div><dt><i class="key blue"></i><span data-i18n="blue">蓝键</span></dt><dd data-i18n="blueDo">扫码页切换二维码</dd></div>
            <div><dt><i class="key blue"></i><span data-i18n="blueLong">长按蓝键 2 秒</span></dt><dd data-i18n="blueLongDo">设置模式</dd></div>
          </dl>
          <p class="muted"><span data-i18n="androidHint">安卓认证窗口无法选图时，用浏览器打开</span> <b class="mono">192.168.4.1</b></p>
          <button id="resetBtn" class="link-danger" type="button" data-i18n="reset">恢复默认设置</button>
        </section>
      </div>
    </div>
  </main>

  <div class="publishbar">
    <div class="pub-status" id="pubStatus" aria-live="polite"></div>
    <button id="publish" class="primary" type="button" data-i18n="publish">发布到胸牌</button>
  </div>
  <div id="toast" role="status"></div>

  <template id="slotTpl">
    <div class="slot">
      <div class="slot-head"><b class="slot-title">二维码</b><button type="button" class="link-danger remove" data-i18n="remove">删除</button></div>
      <div class="grid">
        <label><span data-i18n="showText">显示文字</span><input class="s-label" maxlength="20" data-i18n-placeholder="showTextPh" placeholder="微信扫一扫"></label>
        <label><span data-i18n="qrText">二维码内容</span><input class="s-text mono" maxlength="250" data-i18n-placeholder="qrTextPh" placeholder="链接或文本"></label>
      </div>
      <div class="slot-tools"><button type="button" class="btn ghost small pick" data-i18n="decode">识别截图</button><input class="s-file file-input" type="file" accept="image/*"><span class="s-status"></span></div>
    </div>
  </template>

  <script src="/vendor/qrcode.min.js"></script>
  <script src="/vendor/jsqr.min.js" defer></script>
  <script src="/compose.js"></script>
  <script src="/app.js"></script>
</body>
</html>
